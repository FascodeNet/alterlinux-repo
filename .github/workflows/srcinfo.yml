name: Check .SRCINFO

on:
  pull_request:
    paths: ["alterlinux/**", "alterlinux-aur/**", "alterlinux-nostalgia/**"]
  push:
    branches: [master]
    paths: ["alterlinux/**", "alterlinux-aur/**", "alterlinux-nostalgia/**"]

permissions:
  contents: read

# alterlinux-aur holds AUR submodules plus a few PKGBUILDs of our own. The
# submodules keep their .SRCINFO upstream and the diff ignores them, so only
# our own directories are actually checked here.
jobs:
  srcinfo:
    uses: Hayao0819/Kamisato/.github/workflows/srcinfo-check.yml@b0f4d89743f68070e72802533a916e56e1e921bc # master
    with:
      repos: alterlinux alterlinux-aur alterlinux-nostalgia
      version: b0f4d89743f68070e72802533a916e56e1e921bc
