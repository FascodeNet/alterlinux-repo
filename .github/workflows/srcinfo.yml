name: Check .SRCINFO

on:
  pull_request:
    paths: ["alterlinux/**", "alterlinux-nostalgia/**"]
  push:
    branches: [master]
    paths: ["alterlinux/**", "alterlinux-nostalgia/**"]

permissions:
  contents: read

# alterlinux-aur is excluded: its packages are upstream AUR submodules whose
# .SRCINFO is maintained there.
jobs:
  srcinfo:
    uses: Hayao0819/Kamisato/.github/workflows/srcinfo-check.yml@142e661f0679279b48cd02859d2a1b50b09b0c63 # master
    with:
      repos: alterlinux alterlinux-nostalgia
      version: 142e661f0679279b48cd02859d2a1b50b09b0c63
