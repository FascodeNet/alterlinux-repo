name: act-verify

on: [push, workflow_dispatch]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Hayao0819/Kamisato
          ref: b23366f68481af835fc0f624240712dd88c7cf78
          path: kamisato-src
      - uses: actions/setup-go@v7
        with:
          go-version: "1.x"
      - uses: Hayao0819/Kamisato/actions/install@3083262ff7fec53f8013f84ee1b442d1cc19f2bc # master
        with:
          ayaka: "true"
          source_dir: ${{ github.workspace }}/kamisato-src
      - name: Verify ayaka is installed with the container executor
        run: |
          set -e
          which ayaka
          ayaka build --help | grep -- --executor
          echo "install action OK"
