name: act-verify

on: [push, workflow_dispatch]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Hayao0819/Kamisato
          ref: ee9200fa70f2992db30bd9789402714ecc8ab78b
          path: kamisato-src
      - uses: actions/setup-go@v7
        with:
          go-version-file: kamisato-src/go.mod
          cache-dependency-path: kamisato-src/go.sum
      - uses: Hayao0819/Kamisato/actions/install@ee9200fa70f2992db30bd9789402714ecc8ab78b # master
        with:
          ayaka: "true"
          source_dir: ${{ github.workspace }}/kamisato-src
      - name: Verify ayaka is installed with the build backend option
        run: |
          set -euo pipefail
          command -v ayaka
          ayaka build --help | grep -- --backend
          echo "install action OK"
