name: Update upstream versions

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# The update commit is pushed with GITHUB_TOKEN, which never fires on:push, so
# the update workflow dispatches build.yml itself (hence actions: write).
permissions:
  contents: write
  actions: write

# Share the build group so an update never races a bump push from a build run.
concurrency:
  group: build-refs/heads/master

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tooling
        run: pacman -Syu --noconfirm base-devel git go sudo jq pacman-contrib github-cli
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: Hayao0819/Kamisato/actions/install@ee9200fa70f2992db30bd9789402714ecc8ab78b # master
        with:
          ayaka: "true"
          version: ee9200fa70f2992db30bd9789402714ecc8ab78b
      - uses: ./.github/actions/update
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
